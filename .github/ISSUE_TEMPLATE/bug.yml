name: Bug report
description: Something in the app does not work as it should.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for taking the time. Please do not report security problems here. See SECURITY.md.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How can we make it happen?
      placeholder: |
        1. Open Today
        2. Tap Dhuhr
        3. ...
  - type: input
    id: device
    attributes:
      label: Phone or watch, and system version
      placeholder: iPhone 13, iOS 18.2 / Pixel 8, Android 15
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App version
      description: Settings → About shows it.
  - type: input
    id: setup
    attributes:
      label: Language, city and calculation method
      description: Only if it is about prayer times. A city name is enough. You do not have to share where you live.
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      description: Optional. Please check they show nothing private.
