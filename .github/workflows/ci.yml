name: CI

# App checks only. The website has its own workflow (website.yml) with the mirror-image path
# filter, so site changes don't run the app's test suite and app changes don't build the site.
# docs/ is deliberately NOT ignored: privacyClaims.test.ts reads docs/PRIVACY_POLICY.md.
on:
  push:
    branches: [main]
    paths-ignore:
      - 'website/**'
      - '.github/workflows/website.yml'
  # Every pull request, with no path filter: `checks` is a required check on main, and a
  # required check that never starts leaves the pull request waiting forever.
  pull_request:

# Read-only token: these jobs only check out and test the code.
permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Typecheck
        run: bun run typecheck
      - name: Lint
        run: bun run lint
      - name: Test
        run: bun run test --ci
