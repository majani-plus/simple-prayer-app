name: Website

# Builds the marketing/legal site in website/. Triggers on site changes AND on the repo files the
# site renders from — the privacy policy markdown, the design tokens, and the store screenshots —
# so the published page can't silently drift from its audited sources (docs/DECISIONS.md D50).
#
# Since /times, the site vendors the app's prayer-time domain and its shared vocabulary at build
# time (website/scripts/generate-domain.ts), so those paths belong here too. Without them a change
# to src/domain/ would reach the published site on the next unrelated deploy, unbuilt and untested
# — and `bun run build` runs the app-versus-site agreement check, which is what would catch it.
on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - 'docs/PRIVACY_POLICY.md'
      - 'docs/screenshots/**'
      - 'src/theme/tokens.ts'
      - 'src/domain/**'
      - 'src/i18n/locales/**'
      - 'patches/**'
      - '.github/workflows/website.yml'
  # Every pull request, with no path filter: `build` is a required check on main, and a
  # required check that never starts leaves the pull request waiting forever.
  pull_request:

# Read-only token: these jobs only check out and test the code.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v4
      # Astro 7 needs Node >= 22.23.4, and the `astro` binary runs under Node, not Bun. Same
      # pinned version Cloudflare Pages reads.
      - uses: actions/setup-node@v4
        with:
          node-version-file: website/.node-version
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Typecheck
        run: bun run check
      - name: Build
        run: bun run build
      # Deploy is intentionally absent: Cloudflare Pages deploys from its own Git integration
      # (root `website`, `bun install --frozen-lockfile && bun run build`, output `dist`).
