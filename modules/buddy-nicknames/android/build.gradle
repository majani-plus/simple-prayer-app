plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.buddynicknames'
version = '1.0.0'

android {
  namespace "expo.modules.buddynicknames"
  defaultConfig {
    versionCode 1
    versionName "1.0.0"
  }
}

dependencies {
  // `BuddyMessagingService` subclasses Expo's own FCM service so it can rewrite a notification
  // before Expo builds it. Both are compile-time needs: Firebase for `RemoteMessage`, and
  // expo-notifications for the service and delegate it extends. Autolinking puts both on the
  // settings.gradle graph, so the project reference resolves in the generated android project.
  compileOnly project(':expo-notifications')
  implementation 'com.google.firebase:firebase-messaging:24.1.0'
}
