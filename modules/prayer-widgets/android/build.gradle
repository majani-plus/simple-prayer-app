plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.prayerwidgets'
version = '1.0.0'

android {
  namespace "expo.modules.prayerwidgets"
  defaultConfig {
    versionCode 1
    versionName "1.0.0"
  }
}

dependencies {
  // The seal tap tells the buddies itself (D180), and the sender — with the relay secret, the
  // outbox and the ledger behind it — lives in `modules/buddy-nicknames`, the module that already
  // owns everything buddy mode leaves for processes with no JS in them. Autolinking puts every
  // local module on the settings.gradle graph, so the project reference resolves in the generated
  // android project the same way `:expo-notifications` does next door.
  implementation project(':buddy-nicknames')
}
